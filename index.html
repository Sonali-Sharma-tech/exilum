<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no" />
<title>EXILIUM</title>
<style>
  :root { color-scheme: dark; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { width:100%; height:100%; overflow:hidden; background:#05060a; }
  body { font-family: "Trajan Pro","Cinzel",Georgia,serif; -webkit-font-smoothing:antialiased; cursor:none; }
  /* width/height 100% are LOAD-BEARING, not decoration. A canvas's width/height attributes
     are its intrinsic size, and `inset:0` alone does NOT override that for a replaced
     element — so at devicePixelRatio 2 the canvas displayed at its 2x backing-store size and
     only its top-left quarter was visible (the character rendered beside the mana orb). */
  #viewport { position:fixed; inset:0; display:block; width:100%; height:100%; }
  #ui-root { position:fixed; inset:0; pointer-events:none; z-index:10; }
  #boot { position:fixed; inset:0; z-index:100; display:flex; align-items:center; justify-content:center;
          flex-direction:column; gap:22px; background:#05060a; transition:opacity .8s ease; }
  #boot.done { opacity:0; pointer-events:none; }
  #boot h1 { font-size:clamp(34px,7vw,74px); letter-spacing:.34em; font-weight:400;
             color:#c9a227; text-shadow:0 0 34px rgba(201,162,39,.34); }
  #boot .bar { width:min(340px,60vw); height:2px; background:#1a1c22; overflow:hidden; }
  #boot .bar i { display:block; height:100%; width:0%; background:linear-gradient(90deg,#6b5518,#c9a227,#f0d97a);
                 transition:width .25s ease; }
  #boot p { font-size:11px; letter-spacing:.24em; color:#5d626e; text-transform:uppercase; }
</style>
</head>
<body>
  <canvas id="viewport"></canvas>
  <div id="ui-root"></div>
  <div id="boot"><h1>EXILIUM</h1><div class="bar"><i></i></div><p data-boot-msg>forging the world</p></div>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
